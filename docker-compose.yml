services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:17-alpine
    container_name: xinshi_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD:?请在 .env 中配置高强度 DB_PASSWORD}"
      POSTGRES_DB: xinshi_system
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xinshi_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xinshi_backend
    environment:
      APP_ENV: "development"
      SECRET_KEY: "${SECRET_KEY:?请在 .env 中配置高强度 SECRET_KEY}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-480}"
      AUTH_THROTTLE_HMAC_KEY: "${AUTH_THROTTLE_HMAC_KEY:?请配置独立的 AUTH_THROTTLE_HMAC_KEY}"
      AUTH_LOGIN_WINDOW_SECONDS: "${AUTH_LOGIN_WINDOW_SECONDS:-900}"
      AUTH_LOGIN_ACCOUNT_FAILURE_LIMIT: "${AUTH_LOGIN_ACCOUNT_FAILURE_LIMIT:-5}"
      AUTH_LOGIN_SOURCE_FAILURE_LIMIT: "${AUTH_LOGIN_SOURCE_FAILURE_LIMIT:-30}"
      AUTH_LOGIN_BASE_BLOCK_SECONDS: "${AUTH_LOGIN_BASE_BLOCK_SECONDS:-60}"
      AUTH_LOGIN_MAX_BLOCK_SECONDS: "${AUTH_LOGIN_MAX_BLOCK_SECONDS:-900}"
      AUTH_LOGIN_ESCALATION_RESET_SECONDS: "${AUTH_LOGIN_ESCALATION_RESET_SECONDS:-3600}"
      AUTH_LOGIN_AUDIT_RETENTION_DAYS: "${AUTH_LOGIN_AUDIT_RETENTION_DAYS:-90}"
      AUTH_LOGIN_CAPTCHA_THRESHOLD: "${AUTH_LOGIN_CAPTCHA_THRESHOLD:-2}"
      AUTH_LOGIN_CAPTCHA_TTL_SECONDS: "${AUTH_LOGIN_CAPTCHA_TTL_SECONDS:-120}"
      AUTH_LOGIN_CAPTCHA_ISSUE_LIMIT_PER_MINUTE: "${AUTH_LOGIN_CAPTCHA_ISSUE_LIMIT_PER_MINUTE:-10}"
      # 默认 Compose 网络位于 172.16.0.0/12；应用只在这些可信代理来源下解析 X-Forwarded-For。
      AUTH_TRUSTED_PROXY_CIDRS: "${AUTH_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12}"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: "${DB_PASSWORD:?请在 .env 中配置高强度 DB_PASSWORD}"
      DB_NAME: xinshi_system
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-5}"
      DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW:-5}"
      DB_POOL_TIMEOUT_SECONDS: "${DB_POOL_TIMEOUT_SECONDS:-10}"
      DB_STATEMENT_TIMEOUT_MS: "${DB_STATEMENT_TIMEOUT_MS:-30000}"
      DB_LOCK_TIMEOUT_MS: "${DB_LOCK_TIMEOUT_MS:-5000}"
      DB_IDLE_TRANSACTION_TIMEOUT_MS: "${DB_IDLE_TRANSACTION_TIMEOUT_MS:-60000}"
      CHAT_UPLOAD_DIR: "/app/data/chat_uploads"
      ANNOTATION_CUSTOM_FIELD_IMAGE_DIR: "/app/data/annotation_custom_field_images"
      CREDENTIAL_ENCRYPTION_ACTIVE_VERSION: "${CREDENTIAL_ENCRYPTION_ACTIVE_VERSION:-}"
      CREDENTIAL_ENCRYPTION_KEYS: "${CREDENTIAL_ENCRYPTION_KEYS:-}"
      SMTP_MODE: "${SMTP_MODE:-disabled}"
      PROJECT_MAIL_SENDER_MODE: "${PROJECT_MAIL_SENDER_MODE:-system}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURITY: "${SMTP_SECURITY:-starttls}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-信实翻译}"
      SMTP_REPLY_TO: "${SMTP_REPLY_TO:-}"
      SMTP_TIMEOUT_SECONDS: "${SMTP_TIMEOUT_SECONDS:-15}"
      SMTP_TEST_RECIPIENT: "${SMTP_TEST_RECIPIENT:-}"
    volumes:
      - chat_uploads:/app/data/chat_uploads
      - annotation_custom_field_images:/app/data/annotation_custom_field_images
    ports:
      # 业务访问统一经过前端 /api 反向代理，禁止局域网客户端绕过代理直连后端。
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 仅允许在本地开发机显式运行：
  # docker compose --profile migration run --rm migrate
  # 云端 Compose 不定义此服务，常驻 API 也没有迁移启动钩子。
  migrate:
    profiles: ["migration"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: "development"
      LOCAL_SCHEMA_MIGRATIONS_ENABLED: "true"
      SECRET_KEY: "${SECRET_KEY:?请在 .env 中配置高强度 SECRET_KEY}"
      AUTH_THROTTLE_HMAC_KEY: "${AUTH_THROTTLE_HMAC_KEY:?请配置独立的 AUTH_THROTTLE_HMAC_KEY}"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: "${DB_PASSWORD:?请在 .env 中配置高强度 DB_PASSWORD}"
      DB_NAME: xinshi_system
      DB_STATEMENT_TIMEOUT_MS: "${MIGRATION_STATEMENT_TIMEOUT_MS:-300000}"
      DB_LOCK_TIMEOUT_MS: "${MIGRATION_LOCK_TIMEOUT_MS:-10000}"
      DB_IDLE_TRANSACTION_TIMEOUT_MS: "${DB_IDLE_TRANSACTION_TIMEOUT_MS:-60000}"
    command: ["python", "-m", "tools.run_runtime_migrations"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # 前端 Nginx
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_OPENPATH_ALLOWED_ROOTS: "${VITE_OPENPATH_ALLOWED_ROOTS:-}"
    container_name: xinshi_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  chat_uploads:
    driver: local
  annotation_custom_field_images:
    driver: local
