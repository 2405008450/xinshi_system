version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:17-alpine
    container_name: xinshi_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "XinShi@2026#PgS3cure!"
      POSTGRES_DB: xinshi_system
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./xinshi_system.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xinshi_backend
    environment:
      SECRET_KEY: "xinshi-system-jwt-secret-key-change-in-production"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: "XinShi@2026#PgS3cure!"
      DB_NAME: xinshi_system
      CHAT_UPLOAD_DIR: "/app/data/chat_uploads"
      ANNOTATION_CUSTOM_FIELD_IMAGE_DIR: "/app/data/annotation_custom_field_images"
      SMTP_MODE: "${SMTP_MODE:-disabled}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURITY: "${SMTP_SECURITY:-starttls}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-信实翻译}"
      SMTP_REPLY_TO: "${SMTP_REPLY_TO:-}"
      SMTP_TIMEOUT_SECONDS: "${SMTP_TIMEOUT_SECONDS:-15}"
      SMTP_TEST_RECIPIENT: "${SMTP_TEST_RECIPIENT:-}"
    volumes:
      - chat_uploads:/app/data/chat_uploads
      - annotation_custom_field_images:/app/data/annotation_custom_field_images
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 前端 Nginx
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: xinshi_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  chat_uploads:
    driver: local
  annotation_custom_field_images:
    driver: local
