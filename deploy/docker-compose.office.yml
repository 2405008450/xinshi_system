# 云端专用叠加文件；PC 不使用 Docker。镜像在 .env 中固定版本或 digest。
services:
  onlyoffice:
    image: "${ANNOTATION_OFFICE_IMAGE:-onlyoffice/documentserver:10.0.0.1}"
    container_name: xinshi_prod_onlyoffice
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: "${ANNOTATION_OFFICE_JWT_SECRET:?请先在云端受保护的 .env 中设置密钥}"
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
      WOPI_ENABLED: "false"
      ALLOW_PRIVATE_IP_ADDRESS: "false"
      ALLOW_META_IP_ADDRESS: "false"
      TZ: Asia/Hong_Kong
    volumes:
      - office_logs:/var/log/onlyoffice
      - office_data:/var/www/onlyoffice/Data
      - office_cache:/var/lib/onlyoffice
      - office_db:/var/lib/postgresql
      - office_fonts:/usr/share/fonts/truetype/custom
    # 只加入项目内部网络，由现有 HTTPS 网关代理；不暴露额外公网端口。
    restart: unless-stopped
    mem_limit: 6g
    cpus: 4
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthcheck | grep -qx true"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  office_logs:
  office_data:
  office_cache:
  office_db:
  office_fonts:
