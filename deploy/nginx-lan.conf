worker_processes 1;

error_log logs/xinshi-lan-error.log warn;
pid logs/xinshi-lan.pid;

events {
    worker_connections 1024;
}

http {
    include E:/xinshi_runtime/nginx-1.30.4/conf/mime.types;
    default_type application/octet-stream;

    # 不记录查询串，避免 Office 签名等临时凭据进入日志。
    log_format main '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent request_id=$request_id '
                    'upstream=$upstream_addr '
                    'request_time=$request_time upstream_connect=$upstream_connect_time '
                    'upstream_header=$upstream_header_time upstream_response=$upstream_response_time '
                    'server_timing="$upstream_http_server_timing"';
    access_log logs/xinshi-lan-access.log main;

    # ---------------------------------------------------------------------
    # 只读查询分流（详见 docs/infra.md「局域网只读查询分流」）。
    # 局域网后端连接云端数据库，每条 SQL 都要付一次公网往返；云端后端与数据库同机。
    # on：普通 GET 查询转发到云端后端；off：全部 /api 请求回到本机 8000（一键回退）。
    # 仓库默认 off：Nginx 直接读取本文件，必须在 docs/infra.md 的启用前置条件全部通过后，
    # 由运维在局域网服务器改为 on 再重启，避免拉取代码后意外切换。
    # 写操作（POST/PUT/PATCH/DELETE）、WebSocket、共享目录、本机磁盘文件、邮件、
    # 鉴权验证码、推送密钥、Office、下载与导出始终留在本机 8000，保持原有行为。
    # ---------------------------------------------------------------------
    map $scheme $xinshi_cloud_read_split {
        default off;
    }

    # nginx map 按书写顺序匹配正则，首个命中生效；局域网例外必须写在通用云端规则之前。
    # tests/test_nginx_lan_api_routing.py 会解析本段并校验代表性路由。
    map "$xinshi_cloud_read_split $request_method $uri" $xinshi_api_target {
        default lan;
        # 鉴权与验证码按来源 IP 绑定；推送密钥、邮件/SMTP 配置、截图签名、健康检查与本机环境相关。
        "~^on GET /api/(auth|push|health|mail-settings|project-mails|mail-inline-images|editor-screenshots)(/|$)" lan;
        # AI 队列保存在各环境本机；查询必须与提交、取消请求落在同一后端。
        "~^on GET /api/thoughts-ai(/|$)" lan;
        # Office 会话与回调使用本机配置。
        "~^on GET /api/projects/annotation/office(/|$)" lan;
        # 稿件安排：派稿文件浏览读取共享目录；邮件状态与预览依赖本机邮件配置。
        "~^on GET /api/manuscript-arrangements/(mail-status|projects/[^/]+/dispatch-files|batches/[^/]+/arrangements/[^/]+/mail-preview)$" lan;
        # 人才查重的 Agent 离线建议读取本机 outputs 文件。
        "~^on GET /api/talents/duplicate-review(/|$)" lan;
        # 附件、图片、资料、下载：可能存放在本机磁盘，或依赖本机存储模式。
        "~^on GET /api/(.+/)?(attachments|files|images|materials|material-uploads|task-images|custom-field-images|content|download|original-data)(/|$)" lan;
        # 导出、模板、Excel/PDF：生成耗时长且依赖本机字体，保持原入口与 300s 超时。
        "~^on GET /api/(.+/)?[^/]*(export|template|excel|xlsx|pdf)[^/]*(/|$)" lan;
        # 其余 GET 只读查询走云端后端。
        "~^on GET /api/" cloud;
    }

    upstream xinshi_cloud_api {
        # 直连云端 HTTPS 网关，不依赖内网 DNS；证书校验使用 proxy_ssl_name。
        server 43.132.156.72:443;
        keepalive 16;
        keepalive_timeout 60s;
    }

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 0.0.0.0:80;
        listen 0.0.0.0:3100;
        server_name _;

        return 301 https://oa.xinshify.com.cn$request_uri;
    }

    server {
        listen 0.0.0.0:443 ssl;
        server_name oa.xinshify.com.cn;
        root E:/xinshi_system/frontend/dist;

        # Nginx 1.30：index.html 的缓存头不能覆盖站点 CSP 等安全响应头。
        add_header_inherit merge;

        ssl_certificate E:/xinshi_runtime/certs/oa.xinshify.com.cn.pem;
        ssl_certificate_key E:/xinshi_runtime/certs/oa.xinshify.com.cn.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        # 图文粘贴需读取公开网页及剪贴板内嵌图片；客户端请求不携带来源站凭据。
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.oa.xinshify.com.cn; frame-src 'self' https://www.oa.xinshify.com.cn; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ws: wss: https: http: data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

        # 报告只允许本站嵌入；脚本保留沙箱隔离，不继承业务页面的禁止嵌入策略。
        location ^~ /reports/minority-transcription-20261113/ {
            add_header_inherit off;
            charset utf-8;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
            add_header Cache-Control "no-cache" always;
            add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; form-action 'none'; sandbox allow-scripts allow-downloads" always;
            try_files $uri =404;
        }

        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files $uri =404;
        }

        location ^~ /api/notifications/ws {
            proxy_pass http://127.0.0.1:8000/notifications/ws$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # 沟通音视频上限100MB，预留 multipart 协议开销。
        location ~ ^/api/(project-chat/annotation|chat/direct)/[^/]+/files(/[^/]+)?$ {
            client_max_body_size 110m;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 按 $xinshi_api_target 分派到内部 location；查询串由 rewrite 自动保留。
        location /api/ {
            client_max_body_size 52m;
            rewrite ^/api/(.*)$ /__xinshi_$xinshi_api_target/$1 last;
        }

        # 本机后端：写操作、共享目录、本机文件及上述例外（与切换前的 /api/ 配置一致）。
        location ^~ /__xinshi_lan/ {
            internal;
            client_max_body_size 52m;
            rewrite ^/__xinshi_lan/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            add_header X-Xinshi-Api-Route lan always;
        }

        # 云端后端：普通 GET 查询。证书必须校验，令牌不得发往未验证的上游。
        location ^~ /__xinshi_cloud/ {
            internal;
            rewrite ^/__xinshi_cloud/(.*)$ /api/$1 break;
            proxy_pass https://xinshi_cloud_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host www.oa.xinshify.com.cn;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_ssl_server_name on;
            proxy_ssl_name www.oa.xinshify.com.cn;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 3;
            # 使用局域网项目 Python 环境自带的 certifi 公共 CA 包（httpx 依赖）；该文件在配置加载时
            # 读取，即使分流开关为 off 也必须存在，否则 nginx -t 失败。
            proxy_ssl_trusted_certificate E:/xinshi_system/.conda_env/Lib/site-packages/certifi/cacert.pem;
            proxy_ssl_session_reuse on;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            # 安全响应头由本站统一添加，避免重复；不把云端 HSTS 策略带到局域网域名。
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;
            add_header X-Xinshi-Api-Route cloud always;
            # 仅在云端不可连接或网关超时时（nginx 自身产生的 502/504）回退本机；
            # 云端业务返回的 4xx/5xx 原样透传（未开启 proxy_intercept_errors）。
            error_page 502 504 = @xinshi_lan_read_fallback;
        }

        location @xinshi_lan_read_fallback {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            add_header X-Xinshi-Api-Route lan-fallback always;
        }

        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            try_files $uri =404;
        }

        location / {
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
