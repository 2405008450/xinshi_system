map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 只在 Word／Excel 主编辑器 HTML 注入快捷保存桥；其他资源沿用原压缩协商。
map $request_uri $office_save_bridge {
    default "";
    ~^/office/(?:[^/?]+/)?web-apps/apps/(?:documenteditor|spreadsheeteditor)/main/index\.html(?:\?|$) '<script src="/office-save-bridge.v1.js"></script>';
}
map $office_save_bridge $office_upstream_encoding {
    default "";
    "" $http_accept_encoding;
}

server {
    listen 443 ssl;
    server_name oa.xinshify.com.cn www.oa.xinshify.com.cn;

    ssl_certificate /etc/nginx/certs/oa.xinshify.com.cn.pem;
    ssl_certificate_key /etc/nginx/certs/oa.xinshify.com.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 禁止公网访问文档服务自带的集成测试示例。
    location ^~ /office/example/ { return 404; }

    # 官方虚拟目录代理。两端浏览器统一访问云端 /office/，保留 WebSocket。
    location ^~ /office/ {
        resolver 127.0.0.11 valid=30s;
        set $office_upstream onlyoffice:80;
        rewrite ^/office/(.*)$ /$1 break;
        proxy_pass http://$office_upstream;
        client_max_body_size 25m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host/office;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding $office_upstream_encoding;
        sub_filter '</head>' '$office_save_bridge</head>';
        sub_filter_once on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        access_log off;
    }

    # 签名 URL 不进入代理访问日志。
    location ~ ^/api/projects/annotation/office/sessions/[^/]+/(source|callback)$ {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        access_log off;
        error_log /dev/null crit;
    }

    # 图片单张上限 10MB，额外预留 multipart 表单边界空间。
    location = /api/project-chat/attachments {
        client_max_body_size 12m;
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }

    # 沟通音视频上限100MB，预留 multipart 协议开销。
    location ~ ^/api/(project-chat/annotation|chat/direct)/[^/]+/files(/[^/]+)?$ {
        client_max_body_size 110m;
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 公司管理附件及正文图片单个上限20MB，预留 multipart 协议开销。
    location ~ ^/api/company-management/sections/[^/]+/(attachments|images)$ {
        client_max_body_size 22m;
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~ ^/api/projects/annotation/(material-uploads|[^/]+/materials)(/|$) {
        client_max_body_size 110m;
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
